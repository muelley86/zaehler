[project]
name = "meters"
version = "0.1.0"
description = "Self-hosted meter-reading webapp (electricity / gas / water)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Kmueller" }]

dependencies = [
    "fastapi>=0.115",
    # Untergrenze wegen DoS-CVEs (urlencoded-Form ignoriert max_fields/
    # max_part_size, GHSA-82w8-qh3p-5jfq). FastAPI zieht Starlette transitiv,
    # verlangt aber nur >=0.46 — daher hier explizit gepinnt.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    # Untergrenze wegen quadratischer Parse-Zeit bei Semikolon-Feldern
    # (DoS, GHSA-5rvq-cxj2-64vf).
    "python-multipart>=0.0.30",
    "itsdangerous>=2.2",
    "pyotp>=2.9",
    "qrcode[pil]>=7.4",
    "openpyxl>=3.1",
    # Zoneinfo-Datenbank: auf Windows zwingend (kein System-tzdata, sonst faellt
    # ZoneInfo("Europe/Berlin") und damit der Settings-Validator beim Start um),
    # auf Linux/macOS harmloser Fallback hinter den Systemdaten.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meters"]

[tool.hatch.build]
include = ["src/meters/py.typed"]

[tool.uv]
package = true

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "SIM",          # flake8-simplify
    "RUF",          # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N802"]
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/meters", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

# openpyxl bringt keine Typ-Stubs mit — als untypisiert behandeln.
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette deprecatet HTTP_422_UNPROCESSABLE_ENTITY (FastAPI nutzt das
    # intern). Seit Starlette 1.3 als StarletteDeprecationWarning (nicht mehr
    # DeprecationWarning) — daher ohne Kategorie nur über die Message matchen.
    # Library-interna, kein eigener Code-Smell.
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*",
    # Alembic 1.x warnt über fehlendes path_separator in alembic.ini
    # (kommt erst ab 2.x als Pflicht). Externes Setting, kein eigener
    # Bug.
    "ignore:.*path_separator.*:DeprecationWarning",
    # Starlette 1.3 deprecatet httpx zugunsten von httpx2 im TestClient.
    # Betrifft nur das Test-Tooling (Produktion nutzt keinen TestClient);
    # httpx2-Migration ist ein eigener Schritt, kein Code-Smell hier.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated.*",
]
