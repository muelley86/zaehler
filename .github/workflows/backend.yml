name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

# Least Privilege: dieser Workflow checkt nur aus + testet, braucht keinen
# Schreib-Token. Ohne diesen Block erbt der Job den (oft weiteren)
# Repo-Default-Scope.
permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Kein Schreib-Token nötig; verhindert, dass der GITHUB_TOKEN nach
          # dem Checkout in .git/config persistiert (zizmor: artipacked).
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      # SPA-Fallback-Tests in test_spa_fallback.py setzen voraus, dass
      # backend/src/meters/static/index.html existiert. Das Verzeichnis ist
      # gitignored — CI muss das Frontend selber bauen, sonst 5 rote Tests.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 (Active LTS seit 10/2025) — passt zu engines.node >=24.
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend-Deps + Build (fuer SPA-Fallback-Tests)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pytest
        run: uv run pytest
