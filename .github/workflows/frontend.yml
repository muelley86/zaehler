name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

# Least Privilege: dieser Workflow checkt nur aus + testet, braucht keinen
# Schreib-Token. Ohne diesen Block erbt der Job den (oft weiteren)
# Repo-Default-Scope.
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Kein Schreib-Token nötig; verhindert, dass der GITHUB_TOKEN nach
          # dem Checkout in .git/config persistiert (zizmor: artipacked).
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 (Active LTS seit 10/2025) — passt zu engines.node >=24.
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript
        run: pnpm type-check

      - name: Vitest
        run: pnpm test:run

      - name: Build
        run: pnpm build
